name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto Find and Build Gradle Project
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
            echo "Menemukan projek Gradle di: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            if [ -f "./gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              gradle assembleDebug
            fi
          else
            echo "File build.gradle tidak ditemukan di repositori!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linxr-APK
          path: "**/build/outputs/apk/**/*.apk"
